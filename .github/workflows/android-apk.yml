name: Android APK

# Builds The Cipher Room as an installable Android APK and publishes it as a
# release asset so it can be downloaded straight onto a phone. Nothing here
# touches the website: the web app is *copied* into the APK at build time by
# tools/build_web_assets.py.

on:
  push:
    branches:
      - main
      - master
      - "claude/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      # Optional signing overrides. When these repository secrets are unset the
      # build falls back to the key checked in at android/keystore/cipherroom.jks,
      # which still produces a fully installable APK. See android/README.md.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the SDK packages the build needs
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Work out the version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
          else
            NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Building version ${NAME} (versionCode ${GITHUB_RUN_NUMBER})"

      - name: Decode the release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.jks"
          {
            echo "CIPHER_KEYSTORE_FILE=${RUNNER_TEMP}/release.jks"
            echo "CIPHER_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
            echo "CIPHER_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
            echo "CIPHER_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Build the release APK
        working-directory: android
        # The build's own bundleWebApp task copies the web app into
        # app/src/main/assets first (see android/app/build.gradle).
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease \
            "-PversionCode=${{ steps.version.outputs.code }}" \
            "-PversionName=${{ steps.version.outputs.name }}"

      - name: Name the APK
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/release/app-release.apk
          DEST="CipherRoom-${{ steps.version.outputs.name }}.apk"
          cp "$SRC" "$DEST"
          # A stable, version-free copy so the download link never changes.
          cp "$SRC" CipherRoom.apk
          echo "path=${DEST}" >> "$GITHUB_OUTPUT"
          ls -lh CipherRoom.apk "$DEST"

      - name: Verify the APK is signed
        run: |
          BT="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          "${BT}/apksigner" verify --print-certs CipherRoom.apk

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CipherRoom-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Write the release notes
        if: github.event_name != 'pull_request'
        run: |
          cat > release-notes.md <<'NOTES'
          Android build of **The Cipher Room** — the whole game ships inside the
          APK, so it runs with no internet connection.

          ### Install it on your phone

          1. Open this page on your Android phone and tap **CipherRoom.apk** below.
          2. Android will ask whether to allow installs from your browser — say yes.
          3. Open the downloaded file from your notifications and tap **Install**.

          Google Play Protect may warn that the app came from outside the Play
          Store; choose **Install anyway**.
          NOTES
          {
            echo ""
            echo "Version ${{ steps.version.outputs.name }}, built from \`${{ github.ref_name }}\` (${GITHUB_SHA:0:7})."
          } >> release-notes.md

      - name: Publish a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "The Cipher Room ${{ steps.version.outputs.name }}" \
            --notes-file release-notes.md \
            "${{ steps.apk.outputs.path }}" CipherRoom.apk

      - name: Publish the rolling "android-latest" release
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-point the rolling tag at this commit so the download link always
          # serves the newest build.
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest \
            --target "${GITHUB_SHA}" \
            --title "The Cipher Room — latest Android build" \
            --notes-file release-notes.md \
            "${{ steps.apk.outputs.path }}" CipherRoom.apk
