import javax.inject.Inject

plugins {
    id 'com.android.application'
}

// versionCode / versionName are supplied by CI (-PversionCode=... -PversionName=...);
// the defaults keep a plain `gradlew assembleRelease` working locally.
def buildVersionCode = (project.findProperty('versionCode') ?: '1') as Integer
def buildVersionName = (project.findProperty('versionName') ?: '1.0.0') as String

android {
    namespace 'com.cipherroom.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.cipherroom.app"
        minSdk 24
        targetSdk 34
        versionCode buildVersionCode
        versionName buildVersionName
        // No native code, no per-density resources: one APK covers every device.
    }

    signingConfigs {
        release {
            // Defaults point at the checked-in key so that anyone can build an
            // installable APK with no setup. CI overrides all four values from
            // repository secrets when they are configured -- see
            // .github/workflows/android-apk.yml.
            storeFile file(System.getenv("CIPHER_KEYSTORE_FILE")
                    ?: "${rootDir}/keystore/cipherroom.jks")
            storePassword System.getenv("CIPHER_KEYSTORE_PASSWORD") ?: "cipherroom"
            keyAlias System.getenv("CIPHER_KEY_ALIAS") ?: "cipherroom"
            keyPassword System.getenv("CIPHER_KEY_PASSWORD") ?: "cipherroom"
        }
    }

    buildTypes {
        release {
            // The app is a thin WebView shell -- there is nothing to shrink, and
            // leaving R8 off keeps the build reproducible and fast.
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // WebViewAssetLoader + the feature-detection helpers used by MainActivity.
    implementation 'androidx.webkit:webkit:1.11.0'
}

/**
 * Runs tools/build_web_assets.py, which copies the Cipher Room web app into a
 * generated directory and vendors its CDN dependencies. The website itself is
 * never touched -- only the copy is rewritten.
 */
abstract class BundleWebApp extends DefaultTask {

    /** Repository root, i.e. where the site and the bundler script live. */
    @Internal
    abstract DirectoryProperty getRepoRoot()

    /** Everything the bundle is built from, so the task can go up to date. */
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getSiteFiles()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void bundle() {
        execOperations.exec {
            it.workingDir = repoRoot.get().asFile
            it.commandLine 'python3', 'tools/build_web_assets.py',
                    '--out', outputDir.get().asFile.absolutePath
        }
    }
}

def repoRootDir = rootProject.layout.projectDirectory.dir("..")

def bundleWebApp = tasks.register('bundleWebApp', BundleWebApp) {
    group = 'build'
    description = 'Bundles the Cipher Room web app into the APK assets.'
    repoRoot.set(repoRootDir)
    // Explicit includes rather than a walk of the repository root: the output
    // directory lives under android/app/build, and must not become an input.
    siteFiles.from(project.fileTree(repoRootDir) {
        include 'index.html'
        include 'manifest.webmanifest'
        include '*.jsx'
        include 'icons/**'
        include 'tools/build_web_assets.py'
        exclude 'android/**'
    })
    outputDir.set(layout.buildDirectory.dir("generated/webAssets"))
}

// Registering the output as a *generated* asset directory is what makes every
// consumer -- asset merging, packaging, lint -- depend on the task properly.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(bundleWebApp) { it.outputDir }
    }
}
